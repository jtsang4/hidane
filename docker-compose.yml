# Production compose for Coolify: deploy this repo as a Docker Compose service.
# Coolify injects env vars; set POSTGRES_PASSWORD and provider API keys there.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hidane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in Coolify}
      POSTGRES_DB: hidane
    volumes:
      - hidane-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hidane"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://hidane:${POSTGRES_PASSWORD}@db:5432/hidane}
      PORT: "2718"
      HIDANE_HOME: /data
      # Provider + model + one key. The daemon refuses to start when they do not
      # fit together (unknown model, no key), rather than failing every reply.
      HIDANE_PI_PROVIDER: ${HIDANE_PI_PROVIDER:-deepseek}
      HIDANE_PI_MODEL: ${HIDANE_PI_MODEL:-deepseek-v4-flash-vision-exp}
      HIDANE_PI_API_KEY: ${HIDANE_PI_API_KEY:-}
      # Provider-specific variable, still honoured when HIDANE_PI_API_KEY is unset.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HIDANE_API_TOKEN: ${HIDANE_API_TOKEN:?set in Coolify}
      HIDANE_WEBHOOK_SECRET: ${HIDANE_WEBHOOK_SECRET:?set in Coolify}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      HIDANE_MAX_WORKERS: ${HIDANE_MAX_WORKERS:-3}
      HIDANE_MAX_TURNS: ${HIDANE_MAX_TURNS:-4}
      HIDANE_MAX_HOPS: ${HIDANE_MAX_HOPS:-24}
      HIDANE_MAX_EXECUTIONS_PER_ITEM: ${HIDANE_MAX_EXECUTIONS_PER_ITEM:-12}
      HIDANE_ATTRIBUTION_THRESHOLD: ${HIDANE_ATTRIBUTION_THRESHOLD:-0.6}
    volumes:
      - hidane-data:/data
    ports:
      - "2718:2718"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2718/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  hidane-db:
  hidane-data:
