name: test

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *docs

permissions:
  contents: read

# A newer push to the same PR or branch makes the older run worthless.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend build
      # Linux runners have no WebKitGTK: the desktop shell is macOS-tested and
      # everything else is covered through the nogui build.
      - name: go vet + test (nogui)
        if: runner.os == 'Linux'
        run: |
          go vet -tags nogui ./...
          go test -race -tags nogui ./...
      # The release builds Windows too; its dependencies must stay in go.sum.
      - name: go vet (windows)
        if: runner.os == 'Linux'
        run: GOOS=windows go vet ./...
      - name: go vet + test
        if: runner.os == 'macOS'
        env:
          CGO_CFLAGS: -mmacosx-version-min=12.0
          CGO_LDFLAGS: -mmacosx-version-min=12.0
        run: |
          go vet ./...
          go vet -tags nogui ./...
          go test -race ./...
      - name: desktop smoke (real Wails window)
        if: runner.os == 'macOS'
        run: make smoke-gui

  frontend:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend check
      - run: pnpm -C frontend test
      - run: pnpm -C frontend build

  e2e:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: make build-nogui fakeagent
      - run: pnpm -C frontend exec playwright install --with-deps chromium webkit
      - run: pnpm -C frontend e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
