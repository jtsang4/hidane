name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend build
      # Linux runners have no WebKitGTK: the desktop shell is macOS-tested and
      # everything else is covered through the nogui build.
      - name: go vet + test (nogui)
        if: runner.os == 'Linux'
        run: |
          go vet -tags nogui ./...
          go test -race -tags nogui ./...
      - name: go vet + test
        if: runner.os == 'macOS'
        env:
          CGO_CFLAGS: -mmacosx-version-min=12.0
          CGO_LDFLAGS: -mmacosx-version-min=12.0
        run: |
          go vet ./...
          go vet -tags nogui ./...
          go test -race ./...
      - name: desktop smoke (real Wails window)
        if: runner.os == 'macOS'
        run: make smoke-gui

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend check
      - run: pnpm -C frontend test
      - run: pnpm -C frontend build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: make build-nogui fakeagent
      - run: pnpm -C frontend exec playwright install --with-deps chromium webkit
      - run: pnpm -C frontend e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
